# Real reflectances (SFU 1995-surface database) x real camera (Nikon D5100, NPL) under D65.
# Pixels are sub-pixel linear mixtures of 1-3 library spectra times shading. E[x|c] is unknown:
# a reference posterior (MLP trend + k-NN residual correction in c) is estimated from a 1M-pixel calibration sample.
# Settings fixed before running any compared method. Inherits methods/head/K/seeds from default.yaml.
base: default.yaml
operator:
  source: colour_camera
  camera: "Nikon 5100 (NPL)"
  illuminant: "D65"
  row_normalize: true
spectra:
  prior: library
  library:
    path: data/raw/sfu/reflect_db.reflect
    n_mix: [1, 2, 3]
    shading: [0.5, 1.0]
    n_calib: 1000000
    n_estimate: 200000   # independent sample for moments, directions and thresholds
    ref_knn: 200         # neighbours for the k-NN residual correction of the reference E[x|c] / median
    ref_net: {width: 512, depth: 4, epochs: 20, batch: 4096, lr: 1.0e-3}   # smooth trend m0(c)
    metamer_knn: 64
encoders:
  m6b:
    variants: [direct, ema, vic, rec01, rec1, rec10]
    recon_weights: {rec01: 0.1, rec1: 1.0, rec10: 10.0}
