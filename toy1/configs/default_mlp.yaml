# Head-capacity control: identical to default.yaml except the shared head is a small MLP.
# Hyperparameters fixed before running (not tuned on any result).
base: default.yaml
head:
  type: mlp
  mlp:
    hidden: [64, 64]   # ReLU
    alpha: 1.0e-3      # L2 penalty
    max_iter: 1000     # L-BFGS iterations
